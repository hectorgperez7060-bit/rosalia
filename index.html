<style>
  :root{
    --paper:#FBF5EF; --card:#FFFFFF; --ink:#2A2621; --muted:#867B72;
    --green:#1F5D50; --green-soft:#E6F0EB; --green-ink:#123f37;
    --rose:#B24A60; --rose-soft:#F7E7EB; --rose-ink:#7f2c3e;
    --honey:#C77F2C; --honey-soft:#FBEEDA;
    --line:#ECE3D9; --line-2:#E1D6C9;
    --danger:#C0392B; --danger-soft:#FBE7E4;
    --shadow:0 1px 2px rgba(42,38,33,.05), 0 8px 24px rgba(42,38,33,.06);
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Nunito Sans',system-ui,sans-serif; color:var(--ink);
    background:var(--paper); line-height:1.45;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:500; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px;}

  /* Header */
  header{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(180deg,#FBF5EF 70%, rgba(251,245,239,0));
    padding:calc(12px + env(safe-area-inset-top)) 18px 8px;
  }
  .brandrow{display:flex; align-items:center; gap:11px;}
  .mark{width:38px; height:38px; flex:none;}
  .brand h1{font-size:26px; letter-spacing:-.01em; line-height:1;}
  .brand p{margin:2px 0 0; font-size:12.5px; color:var(--muted); font-weight:600;}
  .today-pill{margin-left:auto; font-size:12px; font-weight:700; color:var(--green-ink);
    background:var(--green-soft); padding:6px 11px; border-radius:20px; text-transform:capitalize;}

  main{padding:6px 18px 26px; max-width:640px; margin:0 auto;}
  .view{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .eyebrow{font-size:11.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);}
  .section-h{display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 12px;}
  .section-h h2{font-size:21px;}
  .section-h .link{font-size:13px; font-weight:700; color:var(--rose);}

  /* Cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow); margin-bottom:12px;}
  .card.flat{box-shadow:none;}
  .row{display:flex; gap:12px; align-items:center;}
  .grow{flex:1; min-width:0;}
  .muted{color:var(--muted);}
  .small{font-size:13px;}
  .tiny{font-size:11.5px;}
  .b{font-weight:800;}
  .truncate{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700;
    padding:4px 9px; border-radius:20px; background:var(--green-soft); color:var(--green-ink);}
  .chip.rose{background:var(--rose-soft); color:var(--rose-ink);}
  .chip.honey{background:var(--honey-soft); color:var(--honey);}
  .chip.danger{background:var(--danger-soft); color:var(--danger);}
  .chip.grey{background:#F1ECE5; color:var(--muted);}

  .avatar{width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-weight:800; font-size:14px; color:#fff;}

  /* Buttons */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-weight:800; font-size:14.5px; padding:12px 16px; border-radius:13px;
    background:var(--green); color:#fff; transition:transform .06s, filter .15s; width:100%;}
  .btn:active{transform:scale(.98);}
  .btn.rose{background:var(--rose);}
  .btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line-2);}
  .btn.soft{background:var(--green-soft); color:var(--green-ink);}
  .btn.sm{width:auto; padding:9px 13px; font-size:13px; border-radius:11px;}
  .btn.wa{background:#25D366; color:#0a3d1f;}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap;}
  .btnrow .btn{width:auto; flex:1;}

  /* Bottom nav */
  nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:50;
    display:flex; justify-content:space-around;
    background:rgba(255,255,255,.92); backdrop-filter:blur(12px);
    border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
  nav.tabs button{display:flex; flex-direction:column; align-items:center; gap:3px; flex:1;
    font-size:10.5px; font-weight:700; color:var(--muted); padding:2px;}
  nav.tabs button.on{color:var(--rose);}
  nav.tabs svg{width:24px; height:24px;}

  /* Sheet / modal */
  .scrim{position:fixed; inset:0; background:rgba(30,25,22,.42); z-index:60; display:none; align-items:flex-end;}
  .scrim.open{display:flex; animation:fade .2s;}
  .sheet{background:var(--paper); width:100%; max-width:640px; margin:0 auto; border-radius:22px 22px 0 0;
    max-height:92vh; overflow-y:auto; padding:8px 18px calc(26px + env(safe-area-inset-bottom));
    animation:slideup .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes slideup{from{transform:translateY(100%);} to{transform:none;}}
  .grab{width:40px; height:4px; background:var(--line-2); border-radius:3px; margin:8px auto 6px;}
  .sheet h2{font-size:22px; margin:6px 2px 4px;}
  .sheet .sub{color:var(--muted); font-size:13.5px; margin:0 2px 14px;}

  /* Forms */
  label.f{display:block; font-size:12.5px; font-weight:800; color:var(--muted); margin:14px 2px 5px;
    text-transform:uppercase; letter-spacing:.04em;}
  .input,textarea.input,select.input{width:100%; background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 13px; font-size:16px; color:var(--ink); outline:none;}
  .input:focus{border-color:var(--green);}
  textarea.input{resize:vertical; min-height:64px; line-height:1.4;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .pickrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px;}
  .pick{padding:9px 13px; border-radius:20px; border:1.5px solid var(--line-2); background:#fff;
    font-weight:700; font-size:13.5px;}
  .pick.on{background:var(--ink); color:#fff; border-color:var(--ink);}

  .empty{text-align:center; color:var(--muted); padding:34px 16px;}
  .empty svg{width:44px; height:44px; opacity:.4; margin-bottom:8px;}

  .kv{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted); font-size:13px; font-weight:700;}
  .kv .v{text-align:right; font-weight:700; font-size:14px;}

  .thumb{width:100%; border-radius:12px; border:1px solid var(--line); margin-top:10px; display:block;}
  .doc-actions{display:flex; gap:6px; margin-top:8px;}

  /* Assistant */
  .chat{display:flex; flex-direction:column; gap:10px; margin:6px 0 12px;}
  .bub{padding:12px 14px; border-radius:16px; font-size:14.5px; max-width:88%; white-space:pre-wrap; line-height:1.5;}
  .bub.me{background:var(--green); color:#fff; align-self:flex-end; border-bottom-right-radius:5px;}
  .bub.ros{background:#fff; border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:5px;}
  .bub.ros .who{font-size:11px; font-weight:800; color:var(--rose); margin-bottom:3px; letter-spacing:.03em;}
  .qk{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; margin:0 -2px;}
  .qk button{flex:none; white-space:nowrap; background:#fff; border:1.5px solid var(--line-2);
    border-radius:20px; padding:9px 13px; font-size:13px; font-weight:700; color:var(--green-ink);}
  .composer{position:sticky; bottom:0; display:flex; gap:8px; padding:10px 0 2px;
    background:linear-gradient(0deg,var(--paper) 78%, transparent);}
  .composer input{flex:1; background:#fff; border:1.5px solid var(--line-2); border-radius:24px; padding:12px 16px;}
  .composer .send{width:46px; height:46px; flex:none; border-radius:50%; background:var(--rose); color:#fff; font-size:18px;}
  .dots span{display:inline-block; width:6px; height:6px; margin:0 1px; border-radius:50%; background:var(--rose); animation:blink 1.2s infinite;}
  .dots span:nth-child(2){animation-delay:.2s;} .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .banner{background:var(--honey-soft); border:1px solid #EAD3A8; border-radius:14px; padding:12px 14px; font-size:13px; margin-bottom:12px;}
  .banner b{color:var(--honey);}
  .hidden{display:none !important;}
  .plus{position:relative;}
  .alert-dot{position:absolute; top:-3px; right:2px; width:9px; height:9px; background:var(--rose); border-radius:50%; border:2px solid #fff;}
  #printArea{display:none;}
  @media print{
    header,nav.tabs,.scrim,#app{display:none !important;}
    #printArea{display:block !important; white-space:pre-wrap; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#000; padding:16px; line-height:1.5;}
    body{background:#fff; padding:0;}
  }
</style>
</head>

<script>
/* ============================================================
   Rosalía — app familiar de salud (un solo archivo)
   Datos guardados de forma COMPARTIDA (todos los que abren la
   app en la familia ven y editan lo mismo).
   ============================================================ */

const KEYS = ['personas','turnos','estudios','recetas','ordenes','diagnosticos','obrasocial','informes','prestadores'];
let S = {personas:[],turnos:[],estudios:[],recetas:[],ordenes:[],diagnosticos:[],obrasocial:{},informes:[],prestadores:[]};
let tab = 'hoy';

const app = $('#app');

/* ---------- almacenamiento con respaldo automático ----------
   1) nube compartida (sincroniza a toda la familia)
   2) almacenamiento del dispositivo
   3) memoria (última opción; se pierde al cerrar)         */
let _backend='memory', _shared=true;
const _mem={};
const _lsKey = k => 'rosalia.'+k;
async function _detectBackend(){
  if(window.storage && typeof window.storage.set==='function'){
    for(const sh of [true,false]){
      try{ await window.storage.set('rosalia.__t','1',sh); _backend='cloud'; _shared=sh; return; }catch(e){}
    }
  }
  try{ localStorage.setItem('rosalia.__t','1'); localStorage.removeItem('rosalia.__t'); _backend='local'; return; }catch(e){}
  _backend='memory';
}
async function sGet(key){
  if(_backend==='firebase' && fb.ready && key.indexOf('img.')===0){
    try{ const d=await famRef().collection('imagenes').doc(imgDoc(key)).get(); return d.exists?d.data().data:null; }catch(e){ return null; }
  }
  try{
    if(_backend==='cloud'){ const r=await window.storage.get(_lsKey(key),_shared); return r?JSON.parse(r.value):null; }
    if(_backend==='local'){ const v=localStorage.getItem(_lsKey(key)); return v?JSON.parse(v):null; }
    return (key in _mem)?_mem[key]:null;
  }catch(e){ return null; }
}
async function sSet(key,val){
  const s=JSON.stringify(val);
  if(_backend==='firebase' && fb.ready){
    try{
      if(key.indexOf('img.')===0){ await famRef().collection('imagenes').doc(imgDoc(key)).set({data:val}); }
      else { await famRef().set({[key]:JSON.parse(s)},{merge:true}); }
      return true;
    }catch(e){ try{ localStorage.setItem(_lsKey(key),s); }catch(_){} return false; }
  }
  try{
    if(_backend==='cloud'){ await window.storage.set(_lsKey(key),s,_shared); return true; }
    if(_backend==='local'){ localStorage.setItem(_lsKey(key),s); return true; }
    _mem[key]=val; return true;
  }catch(e){
    try{ localStorage.setItem(_lsKey(key),s); return true; }
    catch(e2){ _mem[key]=val; return false; }
  }
}
async function saveAll(keys){ for(const k of (keys||KEYS)) await sSet(k, S[k]); }
function syncBanner(){
  if(_backend==='firebase' && fb.ready) return '';
  if(_backend==='cloud' && _shared) return '';
  if(_backend==='cloud') return `<div class="banner" onclick="syncSheet()"><b>Guardado en tu cuenta.</b> Tocá para activar la sincronización familiar en tiempo real (⚙ arriba).</div>`;
  if(_backend==='local') return `<div class="banner" onclick="syncSheet()"><b>Guardado en este dispositivo.</b> Tocá para conectar a la familia (⚙), o descargá la copia de seguridad cada tanto.</div>`;
  return `<div class="banner" style="background:var(--danger-soft);border-color:#e7b3ac"><b>Atención:</b> este visor no permite guardar de forma permanente. Descargá la copia de seguridad antes de cerrar.</div>`;
}

/* ---------- sincronización familiar con Firebase (ya configurada) ---------- */
const DEFAULT_CFG = {
  familyId:'ocampos',
  gemini:'AQ.Ab8RN6LxvyCp2XyqWDFyRvt56Q065JMsqHxtOp8Q5VDBo0X7Jw',
  config:{
    apiKey:"AIzaSyA6CDWnGB0_7Loi84hbsbhIoPrx0PjIPmM",
    authDomain:"rosalia-e48f5.firebaseapp.com",
    projectId:"rosalia-e48f5",

};
let cfg=Object.assign({}, DEFAULT_CFG);
let fb={app:null,db:null,auth:null,ready:false,familyId:'',unsub:null};
const imgDoc = k => k.replace(/[^\w-]/g,'_');
const famRef = () => fb.db.collection('familias').doc(fb.familyId);
function loadCfg(){ try{ const v=localStorage.getItem('rosalia.cfg'); if(v) cfg=Object.assign({}, DEFAULT_CFG, JSON.parse(v)); }catch(e){} }
function saveCfg(){ try{ localStorage.setItem('rosalia.cfg', JSON.stringify(cfg)); }catch(e){} }
function parseConfig(raw){
  try{ const m=(raw||'').match(/\{[\s\S]*\}/); if(!m) return null;
    const o=(new Function('return ('+m[0]+')'))(); return (o&&o.apiKey&&o.projectId)?o:null; }catch(e){ return null; }
}
async function initFirebase(reconnect){
  try{
    if(!window.firebase || !cfg.config) return false;
    if(fb.unsub){ fb.unsub(); fb.unsub=null; }
    if(firebase.apps.length){
      if(reconnect){ await firebase.app().delete(); fb.app=firebase.initializeApp(cfg.config); }
      else { fb.app=firebase.app(); }
    } else { fb.app=firebase.initializeApp(cfg.config); }
    fb.db=firebase.firestore();
    // SIN caché offline a propósito: la copia guardada en el dispositivo hacía
    // que apareciera un instante una versión vieja/vacía y tapara los datos
    // reales de la nube (el "aparecen y se van"). Siempre leemos de la nube.
    fb.auth=firebase.auth();
    try{ await fb.auth.signInAnonymously(); }catch(e){ console.warn('anon auth', e); }
    fb.familyId=cfg.familyId; fb.ready=true; return true;
  }catch(e){ console.warn('Firebase',e); fb.ready=false; return false; }
}
async function ensureFamilyDoc(){
  const snap=await famRef().get();
  if(!snap.exists){
    if(!S.personas || !S.personas.length) seed();
    const p={}; KEYS.forEach(k=>p[k]=JSON.parse(JSON.stringify(S[k]))); await famRef().set(p,{merge:true});
  }
}
function subscribe(){
  if(fb.unsub) fb.unsub();
  let primero=true;
  fb.unsub=famRef().onSnapshot(snap=>{
    const d=snap.data()||{};
    // Blindaje: una foto sin personas (cache viejo/offline/vacío) NUNCA debe
    // borrar de la pantalla los datos reales que ya se están viendo.
    if(!d.personas || !d.personas.length){ primero=false; return; }
    let got=false;
    KEYS.forEach(k=>{ if(d[k]!=null){ S[k]=d[k]; got=true; } });
    if(got){
      if(!primero && !snap.metadata.hasPendingWrites) avisarCambioFamilia();
      render();
    }
    primero=false;
  }, err=>console.warn('snapshot',err));
}
function avisarCambioFamilia(){
  try{
    if(navigator.vibrate) navigator.vibrate([80,40,80]);
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.32);
    o.start(); o.stop(ctx.currentTime+0.34);
    setTimeout(()=>ctx.close(),500);
  }catch(e){}
  const t=document.getElementById('todayPill'); if(t){ t.style.transition='background .3s'; const prev=t.style.background; t.style.background='#B24A60'; t.style.color='#fff'; setTimeout(()=>{t.style.background=prev; t.style.color='';},900); }
}

}

    ${cfg.config?`<button class="btn ghost" style="margin-top:8px;color:var(--danger)" onclick="desconectarSync()">Desconectar de Firebase</button>`:''}
    <details style="margin-top:18px"><summary class="b" style="cursor:pointer;padding:6px 0">Cómo obtener la configuración (una sola vez)</summary>
      <ol class="small" style="padding-left:18px;line-height:1.75;color:var(--muted)">
        <li>Entrá a <b>console.firebase.google.com</b> con tu cuenta de Google y creá un proyecto (gratis, sin tarjeta).</li>
        <li>Agregá una app <b>Web</b> (ícono <span class="mono">&lt;/&gt;</span>). Te muestra un bloque <b>firebaseConfig</b>: copialo y pegalo arriba.</li>
        <li><b>Build → Firestore Database → Crear base de datos</b>.</li>
        <li><b>Build → Authentication → Sign-in method →</b> activá <b>Anónimo</b>.</li>
        <li>En Firestore → <b>Reglas</b>, poné esta línea dentro de match: <br><span class="mono tiny">allow read, write: if request.auth != null;</span></li>
        <li>Pasales el mismo <b>código</b> y la misma <b>configuración</b> a los otros tres celulares.</li>
      </ol></details>`);
}
async function saveSync(){
  const fam=(val('sy_fam')||'familia').toLowerCase().replace(/[^a-z0-9_-]/g,'')||'familia';
  const raw=document.getElementById('sy_cfg').value.trim();
  const conf=parseConfig(raw);
  if(!conf){ alert('No pude leer la configuración. Pegá el objeto firebaseConfig completo (tiene apiKey y projectId).'); return; }
  cfg={familyId:fam, configRaw:raw, config:conf}; saveCfg(); closeSheet();
  const ok=await initFirebase(true);
  if(ok){ _backend='firebase'; await ensureFamilyDoc(); subscribe(); render();
    alert('¡Conectado! Ahora la familia comparte los datos en tiempo real.'); }
  else { alert('Guardé la configuración, pero no pude conectar. Revisá que Firestore y el acceso Anónimo estén habilitados, y que la config sea correcta.'); }
}
async function desconectarSync(){
  if(!confirm('¿Desconectar este celular de Firebase? Los datos quedan en la nube; el celular vuelve a guardar localmente.')) return;
  if(fb.unsub){ fb.unsub(); fb.unsub=null; } fb.ready=false;
  cfg={familyId:'',configRaw:'',config:null}; saveCfg(); closeSheet();
  await _detectBackend(); render();
}

let _scan={img:null};
function fileB64(file){ return new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file);}); }
function extraerJSON(t){ try{ t=(t||'').replace(/```json|```/g,''); const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<0) return null; return JSON.parse(t.slice(a,b+1)); }catch(e){ return null; } }
function matchPersona(name){
  if(!name) return personaTitular().id;
  const n=(''+name).toLowerCase();
  const hit=S.personas.find(p=>{const pn=p.nombre.toLowerCase(); return pn.includes(n)||n.includes(pn.split(' ')[0]);});
  return (hit||personaTitular()).id;
}
function promptExtraccion(){
  const nombres=S.personas.map(p=>p.nombre).join(', ');
  return `Analizá este documento médico argentino y respondé SOLO un JSON válido, sin texto extra ni explicación, con esta forma exacta:
{"tipo":"turno|estudio|receta|orden|diagnostico|otro","persona":"","fecha":"YYYY-MM-DD","hora":"HH:MM","profesional":"","especialidad":"","lugar":"","medicamento":"","dosis":"","frecuencia":"","estudio":"","resultado":"","diagnostico":"","notas":""}
Criterios de "tipo": turno = una cita con fecha/hora; estudio = un resultado de análisis o imagen; receta = prescripción de medicación; orden = el médico pide un estudio o práctica a realizar; diagnostico = informa un diagnóstico. Personas de la familia: ${nombres}. Asigná "persona" al nombre que mejor coincida si aparece. Completá solo lo que veas; dejá vacío lo que no. Fecha en formato YYYY-MM-DD.`;
}
function escanearUI(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*,application/pdf';
  inp.onchange=async()=>{ if(inp.files[0]) await analizarDoc(inp.files[0]); };
  inp.click();
}
async function analizarDoc(file){
  openSheet(`<h2>Analizando…</h2><p class="sub">Rosalía está leyendo el documento para ver dónde archivarlo.</p>
    <div style="text-align:center;padding:26px"><span class="dots"><span></span><span></span><span></span></span></div>`);
  try{
    _scan.img=null; let pdfB64=null;
    if(file.type.indexOf('image/')===0){ _scan.img=await resizeImg(file); }
    else if(file.type==='application/pdf'){ pdfB64=await fileB64(file); }
    else { closeSheet(); alert('Subí una foto o un PDF.'); return; }
    const txt = await askAI({text:promptExtraccion(), imageDataUrl:_scan.img, pdfB64});
    const j=extraerJSON(txt);
    if(!j) throw new Error('sin json');
    window._scanJ=j; window._scanTipo=(j.tipo&&['turno','estudio','receta','orden','diagnostico'].includes(j.tipo))?j.tipo:'estudio';
    renderRevisar();
  }catch(e){
    closeSheet();
    console.warn('escaneo', e);
    alert('No pude analizar el documento automáticamente ('+(e&&e.message?e.message:'error desconocido')+'). Probá sacar la foto de nuevo con buena luz, o cargalo a mano con los botones + de cada sección.');
  }
}
function renderRevisar(){
  const j=window._scanJ, tp=window._scanTipo;
  const tipos=[['turno','Turno'],['estudio','Estudio'],['receta','Receta'],['orden','Orden'],['diagnostico','Diagnóstico']];
  let campos=`<label class="f">¿Para quién?</label><select class="input" id="sc_p">${personaOptions(matchPersona(j.persona))}</select>
    <label class="f">Fecha</label><input class="input" type="date" id="sc_f" value="${j.fecha||''}">`;
  if(tp==='turno') campos+=`<label class="f">Hora</label><input class="input" type="time" id="sc_h" value="${j.hora||'09:00'}">
    <label class="f">Especialidad</label><input class="input" id="sc_e" value="${esc(j.especialidad||j.estudio||'')}">
    <label class="f">Profesional</label><input class="input" id="sc_pro" value="${esc(j.profesional||'')}">
    <label class="f">Lugar</label><input class="input" id="sc_l" value="${esc(j.lugar||'')}">`;
  else if(tp==='receta') campos+=`<label class="f">Medicamento</label><input class="input" id="sc_m" value="${esc(j.medicamento||'')}">
    <label class="f">Dosis</label><input class="input" id="sc_d" value="${esc(j.dosis||'')}">
    <label class="f">Frecuencia</label><input class="input" id="sc_fr" value="${esc(j.frecuencia||'')}">
    <label class="f">Médico</label><input class="input" id="sc_pro" value="${esc(j.profesional||'')}">`;
  else if(tp==='orden') campos+=`<label class="f">Qué pidió el médico</label><input class="input" id="sc_est" value="${esc(j.estudio||j.especialidad||'')}">
    <label class="f">Médico</label><input class="input" id="sc_pro" value="${esc(j.profesional||'')}">
    <label class="f">Dónde</label><input class="input" id="sc_l" value="${esc(j.lugar||'')}">`;
  else if(tp==='diagnostico') campos+=`<label class="f">Diagnóstico</label><input class="input" id="sc_diag" value="${esc(j.diagnostico||j.estudio||'')}">
    <label class="f">Médico</label><input class="input" id="sc_pro" value="${esc(j.profesional||'')}">`;
  else campos+=`<label class="f">Tipo de estudio</label><input class="input" id="sc_est" value="${esc(j.estudio||j.especialidad||'Estudio')}">
    <label class="f">Profesional</label><input class="input" id="sc_pro" value="${esc(j.profesional||'')}">
    <label class="f">Resultado</label><textarea class="input" id="sc_res">${esc(j.resultado||'')}</textarea>`;
  campos+=`<label class="f">Notas</label><textarea class="input" id="sc_n">${esc(j.notas||'')}</textarea>`;
  openSheet(`<h2>Rosalía leyó el documento</h2>
    <p class="sub">Lo detecté como <b>${tipos.find(t=>t[0]===tp)[1].toLowerCase()}</b>. Revisá, corregí si hace falta y archivá.</p>
    ${_scan.img?`<img class="thumb" src="${_scan.img}">`:'<div class="small muted">Documento PDF cargado.</div>'}
    <label class="f">¿Dónde lo archivo?</label>
    <div class="pickrow">${tipos.map(([k,l])=>`<button class="pick ${tp===k?'on':''}" onclick="window._scanTipo='${k}';renderRevisar()">${l}</button>`).join('')}</div>
    ${campos}
    <button class="btn" style="margin-top:16px" onclick="guardarScan()">Archivar aquí</button>`);
}
async function guardarScan(){
  const tp=window._scanTipo, pid=val('sc_p'), fecha=val('sc_f'), notas=val('sc_n');

  const id=uid(); let imgKey='';
  if(_scan.img){ imgKey='img.'+id; await sSet(imgKey,_scan.img); }
  if(tp==='turno'){ S.turnos.push({id,personaId:pid,fecha,hora:val('sc_h'),especialidad:val('sc_e'),profesional:pro,lugar:val('sc_l'),direccion:'',notas}); await sSet('turnos',S.turnos); tab='turnos'; }
  else if(tp==='receta'){ S.recetas.push({id,personaId:pid,medicamento:val('sc_m'),dosis:val('sc_d'),frecuencia:val('sc_fr'),profesional:pro,fecha,duracion:'',notas,recordar:false,imgKey}); await sSet('recetas',S.recetas); tab='salud'; saludFilter.tipo='recetas'; }
  else if(tp==='orden'){ S.ordenes.push({id,personaId:pid,estudio:val('sc_est'),profesional:pro,fecha,dondeIr:val('sc_l'),autorizacion:'',estado:'pendiente',notas,imgKey}); await sSet('ordenes',S.ordenes); tab='salud'; saludFilter.tipo='ordenes'; }
  else if(tp==='diagnostico'){ S.diagnosticos.push({id,personaId:pid,diagnostico:val('sc_diag'),fecha,profesional:pro,notas}); await sSet('diagnosticos',S.diagnosticos); tab='salud'; saludFilter.tipo='diagnosticos'; }
  else { S.estudios.push({id,personaId:pid,tipo:val('sc_est'),fecha,profesional:pro,resultado:(document.getElementById('sc_res')||{}).value||'',notas,imgKey}); await sSet('estudios',S.estudios); tab='salud'; saludFilter.tipo='estudios'; }
  _scan.img=null; closeSheet(); saludFilter.persona='todos'; render();
}

function textoInforme(n){
  const list=[...S.informes].sort((a,b)=>b.semana.localeCompare(a.semana)).slice(0,n||4);
  const p=personaTitular();
  let t=`INFORME PARA LA DOCTORA\nPaciente: ${p.nombre} — DNI ${p.dni||'—'}\nObra social: ${S.obrasocial.nombre||''}${p.cud&&p.cud.tiene?' — CUD (artritis reumatoidea)':''}\nFecha: ${new Date().toLocaleDateString('es-AR')}\n\n`;
  const meds=S.recetas.filter(r=>r.personaId===p.id);
  if(meds.length){ t+='MEDICACIÓN ACTUAL:\n'+meds.map(m=>`• ${m.medicamento}${m.dosis?' '+m.dosis:''}${m.frecuencia?' — '+m.frecuencia:''}`).join('\n')+'\n\n'; }
  t+='EVOLUCIÓN SEMANAL:';

  const est=S.estudios.filter(e=>e.personaId===p.id).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')).slice(0,5);
  if(est.length){ t+='\n\nESTUDIOS RECIENTES:\n'+est.map(e=>`• ${e.fecha?fdate(e.fecha)+': ':''}${e.tipo}${e.resultado?' — '+e.resultado:''}`).join('\n'); }
  return t;
}

/* Autocorrección: si hay datos viejos guardados en la nube sin completar
   (de antes de tener esta info), los completa con los valores correctos
   una sola vez, sin pisar nada que la familia ya haya editado a mano. */
async function migrarDatos(){
  let cambio=false;
  if(S.obrasocial && !S.obrasocial.telefono){
    S.obrasocial = Object.assign({
      nombre:'OSADEF', telefono:'0800-666-2333 (ADEF) · 0800-345-0299 (cartilla)',
      email:'moron@adef.org.ar', web:'https://www.adef.org.ar',
      sucursal:'Sucursal Morón', direccionSucursal:'Av. Gral. Miguel de Azcuénaga 741, Morón (tel. 011 4628-0097)'
    }, S.obrasocial);
    cambio=true;
  }
  const t=personaTitular();
  if(t && t.id && !t.direccionTrabajo){
    const i=S.personas.findIndex(p=>p.id===t.id);
    if(i>=0){ S.personas[i].direccionTrabajo='Maipú 589, Merlo (Farmacia Nueva Merlo)'; cambio=true; }
  }
  if(cambio){ await sSet('obrasocial',S.obrasocial); await sSet('personas',S.personas); }
}
async function init(){
  loadCfg();
  // Cargar datos y PINTAR YA — la pantalla nunca queda en blanco
  try{ await _detectBackend(); }catch(e){ _backend='local'; }
  try{
    let any=false;
    for(const k of KEYS){ const v=await sGet(k); if(v!=null){ S[k]=v; any=true; } }
    if(!any || !S.personas || !S.personas.length){ seed(); await saveAll(); }
    else{ await migrarDatos(); }
  }catch(e){ if(!S.personas || !S.personas.length) seed(); }
  buildTabs(); render(); fechaPill();
  registrarSW();
  // Firebase en segundo plano — la app YA se pintó arriba, así que NO abandonamos
  // la conexión si el primer handshake tarda. En cuanto Firebase queda listo,
  // pasamos a modo familiar compartido y volvemos a renderizar.
  if(cfg.config && window.firebase){
    initFirebase(false).then(async ok=>{
      if(ok && fb.ready){
        _backend='firebase';
        try{ await ensureFamilyDoc(); await migrarDatos(); }catch(e){ console.warn(e); }
        subscribe(); render();
      }
    }).catch(e=>console.warn('firebase bg', e));
  }
}
function registrarSW(){
  // Service Worker con AUTO-ACTUALIZACION. La app siempre pide la version nueva a
  // la red (network-first); si hay una nueva, se instala, toma control y recarga
  // UNA sola vez. Nunca mas se queda pegada en una version vieja.
  if(!('serviceWorker' in navigator)) return;
  try{
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      try{ reg.update(); }catch(e){}
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState==='visible'){ try{ reg.update(); }catch(e){} }
      });
    }).catch(function(){});
    var recargado=false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(recargado) return; recargado=true; window.location.reload();
    });
  }catch(e){}
}

function fdate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fdateLong(iso){ if(!iso) return '—'; const dt=new Date(iso+'T12:00'); return dt.toLocaleDateString('es-AR',{weekday:'short', day:'numeric', month:'long'}); }
function daysUntil(iso){ if(!iso) return null; const a=new Date(iso+'T00:00'); const b=new Date(); b.setHours(0,0,0,0); return Math.round((a-b)/86400000); }

function proximosTurnos(dias){
  return S.turnos.filter(t=>{const d=daysUntil(t.fecha); return d!=null && d>=0 && (dias==null||d<=dias);})
    .sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
}
function pendientes(){
  const out=[];
  proximosTurnos(7).forEach(t=>out.push({tipo:'turno', ref:t}));
  S.ordenes.filter(o=>o.estado!=='realizada').forEach(o=>out.push({tipo:'orden', ref:o}));
  S.personas.forEach(p=>{
    if(p.cud&&p.cud.tiene&&p.cud.vencimiento){ const d=daysUntil(p.cud.vencimiento);
      if(d!=null && d<=180) out.push({tipo:'cud', ref:p}); }
  });
  return out;
}

function pintarChat(){

  c.innerHTML = chat.map(m=> m.role==='user'

async function enviar(){
  const inp=$('#chatIn'); const t=(inp.value||'').trim(); if(!t) return;
  inp.value=''; chat.push({role:'user',text:t}); pintarChat();
  const c=$('#chat'); const load=document.createElement('div'); load.className='bub ros';
  load.innerHTML=`<div class="who">Rosalía</div><span class="dots"><span></span><span></span><span></span></span>`;
  c.appendChild(load); window.scrollTo({top:document.body.scrollHeight});
  try{
    const txt = await askAI({system:contextoAsistente(), messages: chat.map(m=>({role:m.role, text:m.text}))})
      || 'No pude generar una respuesta ahora. Probá de nuevo.';
    chat.push({role:'assistant',text:txt});
  }catch(e){
    console.warn('asistente', e);
    chat.push({role:'assistant',text: cfg.gemini
      ? 'No me pude conectar con Gemini ('+(e&&e.message?e.message:'error desconocido')+'). Probá de nuevo en un momento.'

}

  return `Sos "Rosalía", asistente de organización de salud de una familia argentina de 4 (Rosalía, su esposo, y las hijas Camila y Abril). Tono cálido, claro, concreto y breve, en español rioplatense.
La titular, Rosalía Ocampos, tiene artritis reumatoidea (enfermedad autoinmune) y CUD. Su medicación le baja las defensas, por eso viajar lejos es un riesgo. El problema recurrente: la obra social les da turnos y prestadores LEJOS del domicilio, y están desorganizados con turnos y resultados.
Tu rol es ADMINISTRATIVO y organizativo. Ayudás con: turnos, estudios, recetas, órdenes, trámites de obra social, CUD, y a REDACTAR mails/reclamos formales listos para enviar. NO das diagnósticos ni indicaciones de tratamiento: para lo médico, derivá al médico tratante.

Si la obra social asigna o insiste con un prestador lejano de los tres puntos: ayudá a plantear el reclamo con firmeza (sin ser agresivo) recordando explícitamente que la afiliada tiene Certificado Único de Discapacidad (CUD) por artritis reumatoidea, que la medicación le baja las defensas por lo que trasladarse lejos implica un riesgo de salud real, y que por Ley 24.901 tienen derecho a un prestador accesible o autorización fuera de cartilla/reintegro. No aceptes un "no hay otra opción" como respuesta final: sugerí el siguiente paso concreto (mail formal, y si no responden, Superintendencia de Servicios de Salud).
Prioridad actual de la familia: el tratamiento de reumatología de Rosalía TODAVÍA NO ESTÁ AUTORIZADO por OSADEF y no quieren seguir esperando. Si preguntan por esto o piden ayuda para destrabarlo, empujá a actuar YA: ofrecé redactar de inmediato el mail de autorización (citando Ley 24.901, CUD y la orden médica) y, si ya pasaron más de ~10-15 días desde el pedido, sugerí escalar directo a la Superintendencia de Servicios de Salud.
Excepción importante: la médica reumatóloga que trata a Rosalía atiende en Capital Federal por elección propia de la familia (confían en ella). NO cuestiones esa distancia ni sugieras cambiarla por una más cercana — la lógica de cercanía/triangulación aplica solo a estudios, laboratorios y otros prestadores que asigna la obra social, no a la médica de cabecera elegida por la familia.

/* ---------- IA: usa Gemini (gratis, con tu API key) o Claude integrado ---------- */
async function askAI(opts){ return cfg.gemini ? askGemini(opts) : askClaude(opts); }
async function askClaude({system, messages, text, imageDataUrl, pdfB64}){
  let msgs;
  if(messages){ msgs = messages.map(m=>({role:m.role==='assistant'?'assistant':'user', content:m.text})); }
  else{
    const content=[];
    if(text) content.push({type:'text', text});
    if(imageDataUrl) content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data:imageDataUrl.split(',')[1]}});
    if(pdfB64) content.push({type:'document', source:{type:'base64', media_type:'application/pdf', data:pdfB64}});
    msgs=[{role:'user', content}];
  }
  const body={model:'claude-sonnet-4-6', max_tokens:1000, messages:msgs};
  if(system) body.system=system;
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  if(data.error) throw new Error(data.error.message||'claude');
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
}
async function askGemini({system, messages, text, imageDataUrl, pdfB64}){
  let contents;
  if(messages){ contents = messages.map(m=>({role:m.role==='assistant'?'model':'user', parts:[{text:m.text}]})); }
  else{
    const parts=[]; if(text) parts.push({text});
    if(imageDataUrl) parts.push({inline_data:{mime_type:'image/jpeg', data:imageDataUrl.split(',')[1]}});
    if(pdfB64) parts.push({inline_data:{mime_type:'application/pdf', data:pdfB64}});
    contents=[{role:'user', parts}];
  }
  const body={contents, generationConfig:{maxOutputTokens:1200}};
  if(system) body.system_instruction={parts:[{text:system}]};
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(cfg.gemini),
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data=await res.json();
  if(data.error) throw new Error(data.error.message||'gemini');
  const c=data.candidates&&data.candidates[0];
  return (c&&c.content&&c.content.parts)?c.content.parts.map(p=>p.text||'').join('').trim():'';
}

   AVISOS: WhatsApp + Calendario (.ics)

function waSend(msg){ window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank'); }

function waMed(id){ const r=S.recetas.find(x=>x.id===id); const p=persona(r.personaId);
  waSend(`💊 Recordatorio de medicación\n${p.nombre.split(' ')[0]}: ${r.medicamento}${r.dosis?` (${r.dosis})`:''}\n${r.rfreq==='semanal'?'Cada semana':'Cada día'} a las ${r.rhora||''} hs`);
}
function pad(n){ return String(n).padStart(2,'0'); }
function icsLocal(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'; }
function icsUTC(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'; }
function icsEsc(s){ return (s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function downloadICS(name, ev){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rosalia//ES','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+uid()+'@rosalia','DTSTAMP:'+icsUTC(new Date()),'DTSTART:'+icsLocal(ev.start),
    'DTEND:'+icsLocal(new Date(ev.start.getTime()+(ev.dur||60)*60000)),'SUMMARY:'+icsEsc(ev.title)];
  if(ev.desc) L.push('DESCRIPTION:'+icsEsc(ev.desc));
  if(ev.loc) L.push('LOCATION:'+icsEsc(ev.loc));
  if(ev.rrule) L.push('RRULE:'+ev.rrule);
  (ev.alarms||[]).forEach(m=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(ev.title),'TRIGGER:-PT'+m+'M','END:VALARM'));
  L.push('END:VEVENT','END:VCALENDAR');
  const blob=new Blob([L.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name+'.ics'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function icsTurno(id){ const t=S.turnos.find(x=>x.id===id); const p=persona(t.personaId);
  const start=new Date((t.fecha||'')+'T'+(t.hora||'09:00'));
  downloadICS('turno_'+p.nombre.split(' ')[0], {title:`${p.nombre.split(' ')[0]} · ${t.especialidad||t.profesional||'Turno'}`,
    desc:[t.profesional,t.notas].filter(Boolean).join(' — '), loc:[t.lugar,t.direccion].filter(Boolean).join(', '),
    start, dur:60, alarms:[1440,120]});
}
function icsMed(id){ const r=S.recetas.find(x=>x.id===id); const p=persona(r.personaId);
  const [h,m]=(r.rhora||'09:00').split(':'); const start=new Date(); start.setHours(+h,+m,0,0); if(start<new Date()) start.setDate(start.getDate()+1);
  downloadICS('med_'+p.nombre.split(' ')[0], {title:`💊 ${r.medicamento}${r.dosis?` (${r.dosis})`:''} · ${p.nombre.split(' ')[0]}`,
    desc:r.frecuencia||'', start, dur:10, rrule: r.rfreq==='semanal'?'FREQ=WEEKLY':'FREQ=DAILY', alarms:[0]});
}

/* ---- backup ---- */
async function exportar(){
  const dump={_app:'Rosalia', fecha:new Date().toISOString(), ...S, imagenes:{}};
  for(const e of S.estudios){ if(e.imgKey){ const d=await sGet(e.imgKey); if(d) dump.imagenes[e.imgKey]=d; } }
  for(const p of S.personas){ if(p.cud&&p.cud.imgKey){ const d=await sGet(p.cud.imgKey); if(d) dump.imagenes[p.cud.imgKey]=d; } }
  const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='rosalia_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}

function importarUI(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{ if(inp.files[0]) await importar(inp.files[0]); };
  inp.click();
}
async function importar(file){
  try{
    const d=JSON.parse(await file.text());
    if(d._app!=='Rosalia' && !confirm('El archivo no parece de Rosalía. ¿Restaurar igual?')) return;
    KEYS.forEach(k=>{ if(d[k]!=null) S[k]=d[k]; });
    if(d.imagenes){ for(const [k,v] of Object.entries(d.imagenes)) await sSet(k,v); }
    await saveAll(); render();
    alert('Copia restaurada.');
  }catch(e){ alert('No se pudo leer el archivo.'); }
}

/* ---- imagen: redimensionar para no ocupar tanto ---- */
function resizeImg(file){ return new Promise((res,rej)=>{
  const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const max=1400; let {width:w,height:h}=img; if(w>max||h>max){ const s=max/Math.max(w,h); w*=s; h*=s; }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',0.7));
  }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}
